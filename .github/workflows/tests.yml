name: NEXUS TITAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Build tested integration snapshot
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=NEXUS-TITAN-V2/ HEAD -o dist/NEXUS_TITAN_V2_Phase6_Integrated.zip
      - name: Upload tested integration ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_TITAN_V2_Phase6_Integrated
          path: dist/NEXUS_TITAN_V2_Phase6_Integrated.zip
          if-no-files-found: error
          retention-days: 30
