name: NEXUS TITAN CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile and run full validation
        run: python scripts/run_project_validation.py
      - name: Generate deterministic research report
        run: python scripts/run_advanced_backtest_suite.py --json-out reports/ci_backtest_report.json
      - name: Stage25 full offline synthetic system backtest and integration smoke
        run: python scripts/run_stage25_full_research_audit.py --json-out reports/stage25_full_offline_audit.json
      - name: Stage62 frozen PR and source compatibility NO-MERGE audit
        run: python scripts/run_stage62_integration_audit.py
      - name: Stage64 fabricated shadow trial governance NO-LIVE smoke
        run: python scripts/run_stage64_shadow_trial_smoke.py
      - name: Stage65 final acceptance NO-GO and PR-overlap evidence smoke
        run: python scripts/run_stage65_final_acceptance.py
      - name: Stage66 complete frozen PR filename inventory NO-MERGE smoke
        run: python scripts/run_stage66_pr_inventory.py
      - name: Stage67 PR3 PR5 calibration lineage exact-source NO-MERGE smoke
        run: python scripts/run_stage67_calibration_reconciliation.py
      - name: Stage68 selected combined candidate offline NO-GO integration smoke
        run: python scripts/run_stage68_combined_candidate.py
      - name: Stage69 synthetic Risk Veto and budget crosscheck NO-LIVE smoke
        run: python scripts/run_stage69_synthetic_risk_budget_smoke.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-validation-py${{ matrix.python-version }}
          path: |
            reports/ci_backtest_report.json
            reports/stage25_full_offline_audit.json
          if-no-files-found: ignore
