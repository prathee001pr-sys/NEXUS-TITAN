name: TITAN Calibration Hardening CI

on:
  push:
    branches:
      - hardening/calibration-wilson-2026-11-02
  pull_request:
    paths:
      - "src/nexus_titan/intelligence/calibration.py"
      - "tests/test_probability_calibration.py"
      - "docs/PROBABILITY_CALIBRATION.md"
      - ".github/workflows/calibration-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline calibration and regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pytest
        run: python -m pip install -e ".[dev]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Run calibration-specific tests
        run: python -m pytest -q tests/test_probability_calibration.py
      - name: Run full offline test suite
        run: python -m pytest -q
